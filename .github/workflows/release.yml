name: Create release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '[0-9]+.[0-9]+'

env:
  FORCE_COLOR: 1

permissions: {}

jobs:
  build:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Release $tag" --notes "" --verify-tag
