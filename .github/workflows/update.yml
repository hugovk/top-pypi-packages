name: Update data

on:
  schedule:
    # First of the month, 06:37 UTC
    - cron: "37 6 1 * *"
  workflow_dispatch:
    inputs:
      push:
        description: "Commit, tag and release (untick for a dry run)"
        type: boolean
        default: true

env:
  FORCE_COLOR: 1

permissions: {}

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the data commit and tag, and to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Generate files
        run: bash generate.sh

      - name: Show diff summary
        run: git diff --stat

      - name: Commit and push
        if: github.event_name == 'schedule' || inputs.push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --update
          git commit -m "Update data for $(date -u '+%Y-%m')"
          git push

      - name: Tag and release
        if: github.event_name == 'schedule' || inputs.push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(date -u '+%Y.%m')
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists, skipping"
            exit 0
          fi
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          # GITHUB_TOKEN pushes don't trigger release.yml, so create it here
          gh release create "$tag" --title "Release $tag" --notes "" --verify-tag
